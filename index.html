<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>防具鍛冶ツール</title>
    <!-- ONNX Runtime Web (AIの頭脳) の読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; margin: 0; padding: 20px; }
        .action-panel { background: #222; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        #scene-select, #scene-smithing { display: none; }
        #scene-select.active, #scene-smithing.active { display: block; }
        h1 { color: #e09f3e; font-size: 1.5rem; text-align: center; }
        .status-bar { display: flex; justify-content: space-around; background: #333; padding: 10px; border-radius: 5px; margin-bottom: 10px; font-size: 1.2rem; }
        #skill-list { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; }
        .skill-btn { background: #444; color: white; border: 1px solid #555; padding: 12px; border-radius: 5px; cursor: pointer; flex: 1 1 30%; min-width: 100px; font-size: 1rem; }
    </style>
</head>
<body>
    <h1>防具鍛冶ツール</h1>

    <!-- レシピ選択画面 -->
    <div id="scene-select" class="active">
        <div class="action-panel">
            <ul id="recipe-list" style="list-style:none; padding:0; margin:0;">
                <!-- ここにインポートボタンとレシピリストが表示されます -->
            </ul>
        </div>
    </div>

    <!-- 鍛冶シミュレーション画面 -->
    <div id="scene-smithing">
        <div class="action-panel">
            <h2 id="current-recipe-name" style="text-align:center; color:#4CAF50; margin-top:0;"></h2>
            <div id="display-jigane" style="text-align:center; color:#aaa; margin-bottom:10px;"></div>
            
            <div class="status-bar">
                <div>温度: <span id="current-temp" style="color:#ffeb3b; font-weight:bold;">1000</span></div>
                <div>集中力: <span id="current-focus" style="color:#00bcd4; font-weight:bold;"></span> / <span id="max-focus"></span></div>
            </div>

            <!-- AIサジェスト表示エリア -->
            <div id="ai-suggestion" style="background:#2a2a2a; border-left:4px solid #00bcd4; padding:10px; margin-bottom:15px;">
                🤖 AIモデルスタンバイ待機中...
            </div>

            <!-- 鍛冶グリッド（マス目） -->
            <div id="smithing-grid"></div>

            <!-- スキルボタン一覧 -->
            <div id="skill-list" style="margin-top:20px;"></div>
            
            <!-- リセットボタン -->
            <button onclick="location.reload()" style="width:100%; margin-top:25px; padding:15px; background:#d32f2f; color:white; border:none; border-radius:5px; font-weight:bold; font-size:1.1rem; cursor:pointer;">最初からやり直す</button>
        </div>
    </div>

    <!-- アプリ本体の読み込み (古い data.js は読み込まない) -->
    <script src="app.js"></script>
</body>
</html>
